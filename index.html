<!DOCTYPE html>

  <style>

    .list-section { margin:21px 0; } .section-head { display:flex; justify-content:space-between; align-items:center; padding-bottom:9px; border-bottom:1px solid var(--line); color:var(--muted); font:11px "DM Mono",monospace; letter-spacing:.06em; text-transform:uppercase; }
    .action-task { margin:9px 0; } .idea-card { position:relative; padding:12px 46px 12px 12px; background:#fff7d9; border:1px solid #f0e2ac; border-radius:8px; font-size:13px; line-height:1.55; } .idea-card small { display:block; color:#8c7a46; margin-top:7px; font:10px "DM Mono",monospace; } .idea-delete { position:absolute; top:10px; right:10px; border:0; background:transparent; color:#9a8245; padding:2px; font-size:11px; } .idea-delete:hover { color:var(--red); }

    .chooser { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(28,36,48,.22); backdrop-filter:blur(8px); } .chooser.hidden { display:none; }
    .chooser-card { width:min(720px,100%); padding:38px; background:var(--paper); border:1px solid white; box-shadow:0 28px 80px rgba(23,35,52,.22); text-align:center; } .chooser-card h2 { margin:5px 0 9px; font:600 38px "Playfair Display",serif; } .chooser-card p { color:var(--muted); margin:0 0 26px; }
    .mode-options { display:grid; grid-template-columns:1fr 1fr; gap:15px; text-align:left; } .mode-card { min-height:210px; padding:23px; border:1px solid var(--line); background:white; text-align:left; transition:.18s; } .mode-card:hover { transform:translateY(-4px); border-color:var(--blue); box-shadow:0 13px 24px rgba(49,90,137,.12); } .mode-symbol { color:var(--blue); font:26px "Playfair Display",serif; } .mode-card strong { display:block; margin-top:32px; font:600 23px "Playfair Display",serif; } .mode-card span { display:block; color:var(--muted); margin-top:5px; font-size:12px; line-height:1.6; }
    @media (max-width:1050px) { .week-layout { grid-template-columns:200px minmax(500px,1fr); overflow:auto; } .todo-layout { grid-template-columns:1fr 280px; } }
    @media (max-width:720px) { .topbar { height:auto; padding:15px 5vw; flex-wrap:wrap; gap:10px; } .today { display:none; } .workspace { padding:24px 5vw; } h1 { font-size:28px; } .view-title { align-items:flex-start; gap:12px; flex-direction:column; } .weekly-focus { width:100%; max-width:none; } .week-layout,.todo-layout { display:block; overflow:visible; } .week-layout > * + * { border-left:0; border-top:1px solid var(--line); } .week-board { overflow:auto; } .day { min-width:105px; } .capture-panel { margin-top:18px; } .mode-options { grid-template-columns:1fr; } .chooser-card { padding:25px; } .chooser-card h2 { font-size:31px; } }
  </style>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">beau <span>TIME, GENTLY</span></div>
      <nav class="view-tabs" aria-label="工作区切换"><button class="active" data-switch="weeks">Weeks</button><button data-switch="todo">待办</button></nav>
      <div class="today" id="todayLabel"></div>
    </header>
    <main class="workspace">
      <section class="view active" id="weeksView">
        <div class="view-title"><div><div class="eyebrow">weekly planning</div><h1>给这一周留出空间</h1></div><div class="weekly-focus"><div class="weekly-focus-head">本周专注 <span>✦</span></div><textarea id="weeklyNote" rows="2" placeholder="这一周，我想把精力放在……"></textarea></div><div class="week-controls"><button class="icon-btn" id="prevWeek" aria-label="上一周">←</button><div class="week-label" id="weekLabel"></div><button class="icon-btn" id="nextWeek" aria-label="下一周">→</button><button class="small-btn" id="currentWeek">本周</button></div></div>
        <div class="week-layout">
          <aside class="panel"><div class="panel-title">清单 <span class="count" id="backlogCount">0</span></div><p class="hint">把任务拖到右侧的某一天，便能安排进这一周。</p><div class="task-stack inbox" id="backlog" data-drop="backlog"></div><div class="quick-add"><label class="eyebrow" for="weekQuickAdd">quick add</label><input id="weekQuickAdd" placeholder="写下一个任务，按 Enter 保存"></div></aside>
          <section class="week-board" id="weekBoard"></section>
          
        </div>
      </section>
      <section class="view" id="todoView">
        <div class="view-title"><div><div class="eyebrow">action box</div><h1>先收集，再行动</h1></div><button class="small-btn" id="goWeeks">安排进 Weeks →</button></div>
        <div class="todo-layout">
          <section class="action-panel"><div class="eyebrow">你的行动箱</div><h2>此刻能做什么？</h2><div class="filters" id="filters"><button class="filter active" data-filter="active">待处理</button><button class="filter" data-filter="all">全部</button><button class="filter" data-filter="done">已完成</button></div><div id="actionLists"></div></section>
          <aside class="capture-panel"><div class="eyebrow">inbox</div><h2>不必现在处理</h2><p>快速记下任务、念头或灵感。它们会安全地留在收集箱，等你准备好再决定。</p><textarea id="captureInput" class="capture-box" placeholder="例如：给妈妈打电话；试试那家新咖啡店；下周做项目大纲……"></textarea><div class="capture-options"><select id="captureKind"><option value="task">一项任务</option><option value="idea">一个想法</option></select><select id="capturePriority"><option value="p2">普通</option><option value="p1">重要</option><option value="p3">轻松</option></select></div><button class="primary-btn full" id="captureBtn">放进收集箱</button><div class="link-note">行动箱和 Weeks 使用同一批任务：在这里完成，周计划会同步；在周计划拖拽安排，这里也会显示日期。</div></aside>
        </div>
      </section>
    </main>
  </div>
  <div class="chooser" id="chooser"><div class="chooser-card"><div class="eyebrow">welcome to beau</div><h2>今天，想从哪里开始？</h2><p>时间规划与任务收集，在同一个安静的空间里。</p><div class="mode-options"><button class="mode-card" data-choice="weeks"><div class="mode-symbol">01</div><strong>Weeks</strong><span>像在纸上规划一样，把任务拖进这一周的节奏。</span></button><button class="mode-card" data-choice="todo"><div class="mode-symbol">02</div><strong>待办</strong><span>快速收集暂时不想处理的任务与想法，再慢慢整理。</span></button></div></div></div>
  <div class="status" id="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /* beau 表字段：title, notes, kind, space, status, priority, scheduled_date, sort_order, created_at, updated_at */
    const SUPABASE_URL = 'https://pyoswqkqvhxlbgwjezia.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_20Sd5qBbpSXzRQIK0AmHNw_RuwwKUqd';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const TABLE = 'beau';
let items = [], currentFilter = 'active', weekOffset = 0, draggingId = null, pointerDrag = null, hiddenIdeaIds = new Set();
    try { hiddenIdeaIds = new Set(JSON.parse(localStorage.getItem('beau-hidden-ideas') || '[]')); } catch (error) { console.warn('无法读取本地隐藏想法', error); }
    const $ = selector => document.querySelector(selector);
    const escapeHTML = text => String(text || '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const dateString = date => { const tz = date.getTimezoneOffset() * 60000; return new Date(date - tz).toISOString().slice(0,10); };
    const startOfWeek = () => { const date = new Date(); date.setHours(0,0,0,0); date.setDate(date.getDate() - ((date.getDay()+6)%7) + weekOffset*7); return date; };
    const showStatus = message => { const el = $('#status'); el.textContent = message; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2800); };
    const priorityLabel = p => ({p1:'重要',p2:'普通',p3:'轻松'}[p] || '普通');
    function showView(view) { document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === view+'View')); document.querySelectorAll('[data-switch]').forEach(el => el.classList.toggle('active', el.dataset.switch === view)); if(view === 'weeks') renderWeek(); else renderTodo(); }
    function dateLabel(date) { return date.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}); }
    function card(item, mode='action') { const element = document.createElement('article'); element.className = `task-card ${item.status === 'done' ? 'done' : ''} ${mode === 'week' ? 'week-task' : ''}`; element.draggable = item.kind === 'task'; element.dataset.id = item.id; element.innerHTML = `<button class="check ${item.status === 'done' ? 'done' : ''}" aria-label="完成任务">${item.status === 'done' ? '✓' : ''}</button><div class="task-main"><div class="task-name">${escapeHTML(item.title)}</div><div class="task-meta"><span class="pill ${item.priority || 'p2'}">${priorityLabel(item.priority)}</span>${item.scheduled_date ? `<span class="pill">${item.scheduled_date.slice(5).replace('-','/')}</span>` : ''}</div></div><button class="edit" aria-label="编辑任务">编辑</button><button class="delete" aria-label="删除">×</button>`;
      element.querySelector('.check').addEventListener('click', event => { event.stopPropagation(); updateItem(item.id, {status:item.status === 'done' ? 'active' : 'done'}); });
      element.querySelector('.delete').addEventListener('click', event => { event.stopPropagation(); removeItem(item.id); });
      const edit = element.querySelector('.edit'); if (edit) edit.addEventListener('click', event => { event.stopPropagation(); const title = prompt('修改任务', item.title); if (title !== null && title.trim() && title.trim() !== item.title) updateItem(item.id,{title:title.trim()}); });
      element.addEventListener('dragstart', () => { draggingId = item.id; element.classList.add('dragging'); }); element.addEventListener('dragend', () => { draggingId=null; element.classList.remove('dragging'); document.querySelectorAll('.over').forEach(el=>el.classList.remove('over')); });
      // HTML5 drag events do not run on iPad/iPhone. Pointer Events cover touch, pen, and mouse.
      element.addEventListener('pointerdown', event => {
        if (event.pointerType === 'mouse' || event.button !== 0 || event.target.closest('button')) return;
        pointerDrag = { id:item.id, element, pointerId:event.pointerId, startX:event.clientX, startY:event.clientY, active:false };
        element.setPointerCapture(event.pointerId);
      });
      element.addEventListener('pointermove', event => {
        if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
        if (!pointerDrag.active && Math.hypot(event.clientX-pointerDrag.startX,event.clientY-pointerDrag.startY) < 8) return;
        pointerDrag.active = true; draggingId = pointerDrag.id; element.classList.add('dragging'); event.preventDefault();
        const zone = document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop]');
        document.querySelectorAll('.over').forEach(el => el.classList.toggle('over',el === zone));
      });
      const finishPointerDrag = event => {
        if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
        const wasDragging = pointerDrag.active;
        const zone = wasDragging ? document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop]') : null;
        const id = pointerDrag.id; pointerDrag = null; draggingId = null; element.classList.remove('dragging'); document.querySelectorAll('.over').forEach(el=>el.classList.remove('over'));
        if (zone) updateItem(id,{scheduled_date:zone.dataset.drop==='backlog'?null:zone.dataset.drop});
      };
      element.addEventListener('pointerup', finishPointerDrag); element.addEventListener('pointercancel', finishPointerDrag);
      return element; }
    function renderWeek() { const monday = startOfWeek(), names=['周一','周二','周三','周四','周五','周六','周日'], today=dateString(new Date()); $('#weekLabel').textContent = `${dateLabel(monday)} — ${dateLabel(new Date(monday.getTime()+6*864e5))}`; const board=$('#weekBoard'); board.innerHTML='';
      names.forEach((name,index) => { const date=new Date(monday); date.setDate(monday.getDate()+index); const iso=dateString(date); const day=document.createElement('div'); day.className=`day ${iso===today?'today':''}`; day.innerHTML=`<div class="day-head"><span class="day-name">${name}</span><span class="day-date">${iso.slice(5).replace('-',' / ')}</span></div><div class="drop-zone" data-drop="${iso}"></div>`; board.appendChild(day); const zone=day.querySelector('.drop-zone'); items.filter(item => item.kind==='task' && item.scheduled_date===iso).forEach(item=>zone.appendChild(card(item,'week'))); wireDropZone(zone); });
      const backlog=$('#backlog'); backlog.innerHTML=''; items.filter(item=>item.kind==='task' && !item.scheduled_date && item.status!=='done').forEach(item=>backlog.appendChild(card(item))); if(!backlog.children.length) backlog.innerHTML='<div class="empty">这里很安静。去待办页面收集一个任务吧。</div>'; wireDropZone(backlog); $('#backlogCount').textContent=items.filter(item=>item.kind==='task'&&!item.scheduled_date&&item.status!=='done').length; const memo=items.find(item=>item.kind==='note'&&item.space==='weekly_note'&&item.scheduled_date===dateString(monday)); $('#weeklyNote').value=memo ? memo.title : '';
    }
    function wireDropZone(zone) { zone.addEventListener('dragover', event=>{ event.preventDefault(); zone.classList.add('over'); }); zone.addEventListener('dragleave',()=>zone.classList.remove('over')); zone.addEventListener('drop', event=>{ event.preventDefault(); zone.classList.remove('over'); if(!draggingId) return; updateItem(draggingId,{scheduled_date:zone.dataset.drop==='backlog'?null:zone.dataset.drop}); }); }
    function renderTodo() { const container=$('#actionLists'); container.innerHTML=''; const visible=items.filter(item=>item.kind==='task' && (currentFilter==='all'||(currentFilter==='done'?item.status==='done':item.status!=='done'))); const groups=[['P1 · 重要',visible.filter(i=>i.priority==='p1')],['P2 · 行动',visible.filter(i=>(i.priority||'p2')==='p2')],['P3 · 轻松',visible.filter(i=>i.priority==='p3')]]; groups.forEach(([title,list])=>{ const section=document.createElement('section'); section.className='list-section'; section.innerHTML=`<div class="section-head"><span>${title}</span><span>${list.length}</span></div>`; if(list.length) list.forEach(item=>section.appendChild(card(item,'action'))); else section.insertAdjacentHTML('beforeend','<div class="empty">暂无任务</div>'); container.appendChild(section); }); const ideas=items.filter(i=>i.kind==='idea' && !hiddenIdeaIds.has(i.id)); const ideasSection=document.createElement('section'); ideasSection.className='list-section'; ideasSection.innerHTML=`<div class="section-head"><span>想法收集箱</span><span>${ideas.length}</span></div>`; ideas.forEach(item=>{ const el=document.createElement('div'); el.className='idea-card'; el.innerHTML=`${escapeHTML(item.title)}<small>收集于 ${new Date(item.created_at||Date.now()).toLocaleDateString('zh-CN')}</small><button class="idea-delete" type="button" aria-label="仅从当前页面删除想法">删除</button>`; el.querySelector('.idea-delete').addEventListener('click',()=>hideIdea(item.id)); ideasSection.appendChild(el); }); if(!ideas.length) ideasSection.insertAdjacentHTML('beforeend','<div class="empty">暂时没有想法。</div>'); container.appendChild(ideasSection); }
    async function loadItems() { const {data,error}=await client.from(TABLE).select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false}); if(error) { console.error(error); showStatus('连接 beau 失败：请先执行 beau-schema.sql'); return; } items=data||[]; renderWeek(); renderTodo(); }
    async function addItem(title, kind='task', priority='p2') { if(!title.trim()) return; const payload={title:title.trim(),kind,space:'inbox',status:'active',priority,sort_order:Date.now()}; const {data,error}=await client.from(TABLE).insert(payload).select().single(); if(error) { console.error(error); showStatus('保存失败：请检查 beau 表字段和 RLS'); return; } items.unshift(data); renderWeek(); renderTodo(); showStatus(kind==='idea'?'想法已收好':'任务已加入行动箱'); }
    async function saveWeeklyNote(title) { const weekDate=dateString(startOfWeek()); const existing=items.find(item=>item.kind==='note'&&item.space==='weekly_note'&&item.scheduled_date===weekDate); const payload={title,kind:'note',space:'weekly_note',status:'active',priority:'p2',scheduled_date:weekDate,sort_order:Date.now()}; const request=existing ? client.from(TABLE).update({...payload,updated_at:new Date().toISOString()}).eq('id',existing.id).select().single() : client.from(TABLE).insert(payload).select().single(); const {data,error}=await request; if(error){ console.error(error); showStatus('周专注笔记保存失败'); return; } items=existing?items.map(item=>item.id===existing.id?data:item):[data,...items]; showStatus('本周专注已保存'); }
    async function updateItem(id, changes) { const {data,error}=await client.from(TABLE).update({...changes,updated_at:new Date().toISOString()}).eq('id',id).select().single(); if(error) { console.error(error); showStatus('同步失败，请检查 RLS 设置'); return; } items=items.map(item=>item.id===id?data:item); renderWeek(); renderTodo(); }
    function hideIdea(id) { hiddenIdeaIds.add(id); localStorage.setItem('beau-hidden-ideas',JSON.stringify([...hiddenIdeaIds])); renderTodo(); showStatus('想法已从当前页面移除'); }
    async function removeItem(id) { if(!confirm('删除这条内容吗？')) return; const {error}=await client.from(TABLE).delete().eq('id',id); if(error) { showStatus('删除失败，请检查 RLS 设置'); return; } items=items.filter(item=>item.id!==id); renderWeek(); renderTodo(); }
    document.querySelectorAll('[data-switch]').forEach(button=>button.addEventListener('click',()=>showView(button.dataset.switch))); document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{ $('#chooser').classList.add('hidden'); showView(button.dataset.choice); }));
    $('#prevWeek').addEventListener('click',()=>{weekOffset--;renderWeek();}); $('#nextWeek').addEventListener('click',()=>{weekOffset++;renderWeek();}); $('#currentWeek').addEventListener('click',()=>{weekOffset=0;renderWeek();}); $('#goWeeks').addEventListener('click',()=>showView('weeks'));
    let noteTimer; $('#weekQuickAdd').addEventListener('keydown',event=>{if(event.key==='Enter'){addItem(event.target.value);event.target.value='';}}); $('#captureBtn').addEventListener('click',()=>{addItem($('#captureInput').value,$('#captureKind').value,$('#capturePriority').value);$('#captureInput').value='';}); $('#captureInput').addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter') $('#captureBtn').click();}); $('#filters').addEventListener('click',event=>{const button=event.target.closest('[data-filter]');if(!button)return;currentFilter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('active',el===button));renderTodo();}); $('#weeklyNote').addEventListener('input',event=>{const note=event.target; note.value=note.value.split('\n').slice(0,2).join('\n'); while(note.scrollHeight>note.clientHeight+1 && note.value) note.value=note.value.slice(0,-1); clearTimeout(noteTimer); noteTimer=setTimeout(()=>saveWeeklyNote(note.value),700);});
    $('#todayLabel').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}); loadItems();
  </script>
</body>
